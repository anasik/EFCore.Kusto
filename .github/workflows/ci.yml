name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests and KQL validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # Emulator tests skip here (no KUSTO_EMULATOR_URL); the job below runs them.
      - run: dotnet test -c Release --no-build

  emulator:
    name: Emulator differential tests
    runs-on: ubuntu-latest
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    env:
      KUSTO_EMULATOR_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Wait for the emulator
        run: |
          for _ in $(seq 1 120); do
            curl -sf -X POST "$KUSTO_EMULATOR_URL/v1/rest/mgmt" -H 'Content-Type: application/json' \
              -d '{"csl":".show version","db":"NetDefaultDB"}' >/dev/null && exit 0
            sleep 2
          done
          echo "The emulator did not become ready." >&2
          exit 1
      - run: dotnet test tests/EFCore.Kusto.ConformanceTests -c Release -f net10.0 --filter Category=Emulator
